 
name: NxNative - Generic IPA Builder
 
on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""
 
permissions:
  contents: read
 
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
 
    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: e0e1df7843d2244fcb19c90dd1bf7a5fe0f765cb
 
      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main
 
      - name: Patch host for iPhone SE 2020 / A13 (BC fallback only)
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        shell: bash
        run: |
          set -euo pipefail
          # 1) hle_svc.c: when iOS refuses the profile's guest address-space reservation (ENOMEM on 3 GB devices),
          #    retry smaller (64 MB steps) and report an application pool that matches the smaller heap region.
          # 2) nvn_mtl.m: a GPU without Metal 4 (A13) used to drop every present (black screen);
          #    show the GL window image with a plain classic-Metal render pass instead.
          python - <<'PY'
          import sys

          def patch(path, subs):
              s = open(path, encoding="utf-8").read()
              for old, new in subs:
                  if s.count(old) != 1:
                      raise SystemExit(path + ": expected code not found (checkout differs from the pinned commit):\n" + old)
                  s = s.replace(old, new)
              open(path, "w", encoding="utf-8").write(s)
              print("patched", path)

          # ---- 1. hle_svc.c: smaller guest address-space reservation + matching application pool ----
          patch("dm/host/hle_svc.c", [
          (r'''    g_as = mmap(NULL, g_reserve, PROT_NONE, MAP_PRIVATE | MAP_ANON, -1, 0);
              if (g_as == MAP_FAILED) die("reserve guest AS");
          ''', r'''    size_t floor_reserve = 0x10000000 + alias + DM_GAME_MEM_STACK + 0x20000000, want_reserve = g_reserve;
              for (;;) {
                  g_as = mmap(NULL, g_reserve, PROT_NONE, MAP_PRIVATE | MAP_ANON, -1, 0);
                  if (g_as != MAP_FAILED) break;
                  int e = errno;
                  LOG("reserve guest AS %#zx failed (errno %d)", g_reserve, e);
                  if (g_reserve < floor_reserve + 0x4000000) die("reserve guest AS: even %#zx failed (errno %d)", g_reserve, e);
                  g_reserve -= 0x4000000;
              }
              if (g_reserve != want_reserve) LOG("guest AS reduced from %#zx to %#zx", want_reserve, g_reserve);
          '''),
          (r'''static void mem_init_once(void) {
          ''', r'''static uint64_t g_app_pool = DM_GAME_APP_POOL;
          static size_t big_bss_bytes(void);
          static void mem_init_once(void) {
          '''),
          (r'''    g_heap  = g_stack + g_stack_cap; g_heap_cap  = g_reserve - (size_t)(g_heap - g_as);
          ''', r'''    g_heap  = g_stack + g_stack_cap; g_heap_cap  = g_reserve - (size_t)(g_heap - g_as);
              if (g_reserve < want_reserve) {
                  uint64_t fit = (uint64_t)g_heap_cap + (uint64_t)DM_GAME_MEM_USED + big_bss_bytes();
                  if (fit < g_app_pool) { LOG("application pool reduced from %#llx to %#llx to fit the heap region %#zx", (unsigned long long)g_app_pool, (unsigned long long)fit, g_heap_cap); g_app_pool = fit; }
              }
          '''),
          (r'''#define APP_POOL DM_GAME_APP_POOL ''', r'''#define APP_POOL g_app_pool '''),
          ])

          # ---- 2. nvn_mtl.m: classic Metal present for GPUs without Metal 4 (iPhone SE 2020 / A13) ----
          patch("dm/gfx/nvn/nvn_mtl.m", [
          (r'''static uint64_t present_enqueue(const tex_t *t, double period, const int crop[4], uint64_t ev_val) {
              atomic_store(&dm_present_ns, now_ns());
              if (g_classic || atomic_load(&g_present_discard)) return 0;''',
          r'''// Classic present: a GPU without Metal 4 (iPhone SE 2020's A13) starts only the classic part (mtl_init: g_classic), which used to drop every present. The GL and Vulkan layers draw
          // complete frames on classic queues, so show the window image with one plain render pass on the classic queue: wait for the producer's event, draw it letterboxed into the layer's
          // drawable, present. No MetalFX, snapshots or display link. Returns the ticket the producer waits on before drawing into the image again.
          static id<MTLRenderPipelineState> g_cls_pso; static MTLPixelFormat g_cls_fmt; static id<MTLSamplerState> g_cls_smp;
          static uint64_t present_classic(const tex_t *t, uint64_t ev_val) {
              CAMetalLayer *layer = (__bridge CAMetalLayer *)front_metal_layer();
              if (!layer || !t) return 0;
              id<MTLTexture> src = tex_mtl(t);
              if (!src) return 0;
              if (!g_cls_pso || g_cls_fmt != layer.pixelFormat) {
                  NSString *msl = @"#include <metal_stdlib>\n"
                                  "using namespace metal;\n"
                                  "struct VO { float4 p [[position]]; float2 uv; };\n"
                                  "vertex VO cls_vs(uint vid [[vertex_id]], constant int &flip [[buffer(0)]]) {\n"
                                  "    float2 xy = float2((vid << 1) & 2, vid & 2);\n"
                                  "    VO o; o.p = float4(xy * 2.0 - 1.0, 0.0, 1.0);\n"
                                  "    o.uv = float2(xy.x, flip ? xy.y : 1.0 - xy.y);\n"
                                  "    return o;\n"
                                  "}\n"
                                  "fragment float4 cls_fs(VO i [[stage_in]], texture2d<float> t [[texture(0)]], sampler s [[sampler(0)]]) { return float4(t.sample(s, i.uv).rgb, 1.0); }\n";
                  NSError *e = nil;
                  id<MTLLibrary> lib = [g_dev newLibraryWithSource:msl options:nil error:&e];
                  if (!lib) { static int once; if (!once++) MLOG("[RED] classic present: shader compile failed: %s", e.localizedDescription.UTF8String); return 0; }
                  MTLRenderPipelineDescriptor *pd = [MTLRenderPipelineDescriptor new];
                  pd.vertexFunction = [lib newFunctionWithName:@"cls_vs"]; pd.fragmentFunction = [lib newFunctionWithName:@"cls_fs"];
                  pd.colorAttachments[0].pixelFormat = layer.pixelFormat;
                  g_cls_pso = [g_dev newRenderPipelineStateWithDescriptor:pd error:&e];
                  if (!g_cls_pso) { static int once; if (!once++) MLOG("[RED] classic present: pipeline failed: %s", e.localizedDescription.UTF8String); return 0; }
                  MTLSamplerDescriptor *sd = [MTLSamplerDescriptor new];
                  sd.minFilter = sd.magFilter = MTLSamplerMinMagFilterLinear; sd.sAddressMode = sd.tAddressMode = MTLSamplerAddressModeClampToEdge;
                  g_cls_smp = [g_dev newSamplerStateWithDescriptor:sd];
                  g_cls_fmt = layer.pixelFormat;
                  MLOG("classic present: no Metal 4, drawing the window image to the layer with a plain render pass (%lux%lu -> drawable %.0fx%.0f)", (unsigned long)src.width, (unsigned long)src.height, layer.drawableSize.width, layer.drawableSize.height);
              }
              id<CAMetalDrawable> dr = [layer nextDrawable];
              if (!dr) return 0;
              id<MTLCommandBuffer> cb = [g_q commandBuffer];
              if (ev_val && g_ext_ev) [cb encodeWaitForEvent:g_ext_ev value:ev_val];
              MTLRenderPassDescriptor *rp = [MTLRenderPassDescriptor renderPassDescriptor];
              rp.colorAttachments[0].texture = dr.texture; rp.colorAttachments[0].loadAction = MTLLoadActionClear;
              rp.colorAttachments[0].clearColor = MTLClearColorMake(0, 0, 0, 1); rp.colorAttachments[0].storeAction = MTLStoreActionStore;
              id<MTLRenderCommandEncoder> re = [cb renderCommandEncoderWithDescriptor:rp];
              double dw = (double)dr.texture.width, dh = (double)dr.texture.height, sc = fmin(dw / (double)src.width, dh / (double)src.height), w = (double)src.width * sc, h = (double)src.height * sc;
              [re setViewport:(MTLViewport){(dw - w) / 2, (dh - h) / 2, w, h, 0.0, 1.0}];
              [re setRenderPipelineState:g_cls_pso];
              int flip = atomic_load(&g_origin_ll) ? 1 : 0;   // GL's window image is stored bottom row first
              [re setVertexBytes:&flip length:sizeof flip atIndex:0];
              [re setFragmentTexture:src atIndex:0]; [re setFragmentSamplerState:g_cls_smp atIndex:0];
              [re drawPrimitives:MTLPrimitiveTypeTriangle vertexStart:0 vertexCount:3];
              [re endEncoding];
              pthread_mutex_lock(&g_pq_mu); uint64_t tk = ++g_pq_in; g_pq_inflight++; pthread_mutex_unlock(&g_pq_mu);
              [cb addCompletedHandler:^(id<MTLCommandBuffer> c) {
                  if (c.error) { static int once; if (!once++) MLOG("[RED] classic present: command buffer error: %s", c.error.description.UTF8String); }
                  pthread_mutex_lock(&g_pq_mu); if (tk > g_pq_done) g_pq_done = tk; g_pq_inflight--; pthread_cond_broadcast(&g_pq_cv); pthread_mutex_unlock(&g_pq_mu);
              }];
              [cb presentDrawable:dr];
              [cb commit];
              return tk;
          }
          static uint64_t present_enqueue(const tex_t *t, double period, const int crop[4], uint64_t ev_val) {
              atomic_store(&dm_present_ns, now_ns());
              if (g_classic && !atomic_load(&g_present_discard)) return present_classic(t, ev_val);
              if (g_classic || atomic_load(&g_present_discard)) return 0;'''),
          ])
          PY
          git diff --stat

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
 
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
 
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar glslang
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 capstone fonttools backports.zstd gdown
 
      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"
 
          download_file() {
            local url="$1"
            local output="$2"
            local file_id
 
            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi
 
            file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs
 
          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None
 
          if parsed.netloc.lower() in (
              "drive.google.com",
              "www.drive.google.com",
          ):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]
 
          if not file_id and re.fullmatch(
              r"[-A-Za-z0-9_]{20,}", url
          ):
              file_id = url
 
          if not file_id:
              raise SystemExit(
                  "Could not extract a Google Drive file ID."
              )
 
          print(file_id)
          PY
          )"
 
            echo "Downloading $(basename "$output")..."
            gdown "$file_id" -O "$output"
 
            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi
 
            file "$output"
          }
 
          download_file "$GAME_URL" "$WORK/game.download"
          download_file "$KEYS_URL" "$WORK/prod.keys"
 
          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi
 
          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi
 
          chmod 600 "$WORK/prod.keys"
 
      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"
 
          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path
 
          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz"
          }
          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )
 
          def validate_package(path):
              with path.open("rb") as f:
                  magic = f.read(4)
 
              suffix = path.suffix.lower()
 
              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )
 
              if suffix in (".xci", ".xcz") and magic != b"HEAD":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )
 
          def add_package(source, label):
              target = game_dir / source.name
 
              if target.exists():
                  raise SystemExit(
                      "Duplicate package filename: " + source.name
                  )
 
              validate_package(source)
              shutil.copy2(source, target)
 
              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )
 
          def process_download(label):
              source = work / f"{label}.download"
 
              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return
 
              with source.open("rb") as f:
                  signature = f.read(8)
 
              is_rar = any(
                  signature.startswith(magic)
                  for magic in rar_signatures
              )
 
              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)
 
                  print(f"{label}: RAR archive detected; extracting.")
 
                  subprocess.run(
                      [
                          "unar",
                          "-o",
                          str(extract_dir),
                          str(source),
                      ],
                      check=True,
                  )
 
                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file()
                      and p.suffix.lower() in package_extensions
                  )
 
                  if not packages:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ packages found "
                          f"in the {label} RAR archive."
                      )
 
                  for package in packages:
                      add_package(package, label)
 
              else:
                  print(
                      f"{label}: not a RAR archive; "
                      "checking as a direct package."
                  )
 
                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif signature[:4] == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive "
                          "or direct NSP/XCI package. "
                          "Direct downloads must be NSP or XCI files."
                      )
 
                  target = game_dir / f"{label}{extension}"
 
                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )
 
                  shutil.copy2(source, target)
                  validate_package(target)
 
                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )
 
          process_download("game")
          process_download("update")
          process_download("dlc")
 
          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )
 
          if not packages:
              raise SystemExit("No game packages were prepared.")
 
          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY
 
          test -s "$WORK/prod.keys"
 
      - name: Detect game title ID and select shader profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"
 
          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path
 
          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}
 
          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)
 
                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []
 
                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )
 
                      if count > 100000 or string_size > 100000000:
                          return []
 
                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)
 
                      if len(entries) != count * 0x18:
                          return []
 
                      names = []
 
                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]
 
                          if offset >= len(strings):
                              continue
 
                          end = strings.find(b"\0", offset)
 
                          if end < 0:
                              continue
 
                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )
 
                      return names
 
              except (OSError, struct.error):
                  return []
 
          candidates = set()
 
          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
 
              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )
 
                  if match:
                      title_id = int(match.group(1), 16)
 
                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")
 
              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )
 
              if match:
                  title_id = int(match.group(1), 16)
 
                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")
 
          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP and its ticket/filename."
              )
 
          print(next(iter(candidates)))
          PY
          )"
 
          PROFILE_ID="${PROFILE_OVERRIDE:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"
 
          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi
 
          echo "Detected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"
 
      - name: Update shader toolchain lock and header
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"
 
          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"
 
          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi
 
          # Newer checkouts moved --update-lock into tool_lock.py
          LOCK_SCRIPT="$(dirname "$CHAIN_SCRIPT")/tool_lock.py"
          if [[ -f "$LOCK_SCRIPT" ]]; then
            python "$LOCK_SCRIPT" --update-lock
          else
            python "$CHAIN_SCRIPT" --update-lock
          fi
          python "$CHAIN_SCRIPT" --header
 
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"
 
          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT"
 
          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi
 
          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"
 
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7
 
      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7
 
      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
 
