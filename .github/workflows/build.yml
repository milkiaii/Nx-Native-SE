 
name: NxNative - Generic IPA Builder
 
on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""
      slim:
        description: "Slim IPA: leave game files out of the IPA (small download). Also uploads RomFS.img to copy to the phone once"
        required: false
        type: boolean
        default: false
 
permissions:
  contents: read
 
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
 
    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: e0e1df7843d2244fcb19c90dd1bf7a5fe0f765cb
 
      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main
 
      - name: Patch host for iPhone SE 2020 / A13 (BC fallback only)
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        shell: bash
        run: |
          set -euo pipefail
          # 1) hle_svc.c: when iOS refuses the profile's guest address-space reservation (ENOMEM on 3 GB devices),
          #    retry smaller (64 MB steps) and report an application pool that matches the smaller heap region.
          # 2) nvn_mtl.m: a GPU without Metal 4 (A13) used to drop every present (black screen) for OpenGL / Vulkan games;
          #    show the GL window image with a plain classic-Metal render pass instead.
          # 3) nvn_mtl.m: classic-Metal stand-ins for the Metal 4 queue / command buffers / encoders / argument tables,
          #    so the NVN layer (most Nintendo games) can start on a GPU without Metal 4. Experimental.
          python - <<'PY'
          import sys

          def patch(path, subs):
              s = open(path, encoding="utf-8").read()
              for old, new in subs:
                  if s.count(old) != 1:
                      raise SystemExit(path + ": expected code not found (checkout differs from the pinned commit):\n" + old)
                  s = s.replace(old, new)
              open(path, "w", encoding="utf-8").write(s)
              print("patched", path)

          # ---- 1. hle_svc.c: smaller guest address-space reservation + matching application pool ----
          patch("dm/host/hle_svc.c", [
          (r'''    g_as = mmap(NULL, g_reserve, PROT_NONE, MAP_PRIVATE | MAP_ANON, -1, 0);
              if (g_as == MAP_FAILED) die("reserve guest AS");
          ''', r'''    size_t floor_reserve = 0x10000000 + alias + DM_GAME_MEM_STACK + 0x20000000, want_reserve = g_reserve;
              for (;;) {
                  g_as = mmap(NULL, g_reserve, PROT_NONE, MAP_PRIVATE | MAP_ANON, -1, 0);
                  if (g_as != MAP_FAILED) break;
                  int e = errno;
                  LOG("reserve guest AS %#zx failed (errno %d)", g_reserve, e);
                  if (g_reserve < floor_reserve + 0x4000000) die("reserve guest AS: even %#zx failed (errno %d)", g_reserve, e);
                  g_reserve -= 0x4000000;
              }
              if (g_reserve != want_reserve) LOG("guest AS reduced from %#zx to %#zx", want_reserve, g_reserve);
          '''),
          (r'''static void mem_init_once(void) {
          ''', r'''static uint64_t g_app_pool = DM_GAME_APP_POOL;
          static size_t big_bss_bytes(void);
          static void mem_init_once(void) {
          '''),
          (r'''    g_heap  = g_stack + g_stack_cap; g_heap_cap  = g_reserve - (size_t)(g_heap - g_as);
          ''', r'''    g_heap  = g_stack + g_stack_cap; g_heap_cap  = g_reserve - (size_t)(g_heap - g_as);
              if (g_reserve < want_reserve) {
                  uint64_t fit = (uint64_t)g_heap_cap + (uint64_t)DM_GAME_MEM_USED + big_bss_bytes();
                  if (fit < g_app_pool) { LOG("application pool reduced from %#llx to %#llx to fit the heap region %#zx", (unsigned long long)g_app_pool, (unsigned long long)fit, g_heap_cap); g_app_pool = fit; }
              }
          '''),
          (r'''#define APP_POOL DM_GAME_APP_POOL ''', r'''#define APP_POOL g_app_pool '''),
          ])

          # ---- 2. nvn_mtl.m: classic Metal present for GPUs without Metal 4 (iPhone SE 2020 / A13) ----
          patch("dm/gfx/nvn/nvn_mtl.m", [
          (r'''static uint64_t present_enqueue(const tex_t *t, double period, const int crop[4], uint64_t ev_val) {
              atomic_store(&dm_present_ns, now_ns());
              if (g_classic || atomic_load(&g_present_discard)) return 0;''',
          r'''// Classic present: a GPU without Metal 4 (iPhone SE 2020's A13) starts only the classic part (mtl_init: g_classic), which used to drop every present. The GL and Vulkan layers draw
          // complete frames on classic queues, so show the window image with one plain render pass on the classic queue: wait for the producer's event, draw it letterboxed into the layer's
          // drawable, present. No MetalFX, snapshots or display link. Returns the ticket the producer waits on before drawing into the image again.
          static id<MTLRenderPipelineState> g_cls_pso; static MTLPixelFormat g_cls_fmt; static id<MTLSamplerState> g_cls_smp;
          static uint64_t present_classic(const tex_t *t, uint64_t ev_val) {
              CAMetalLayer *layer = (__bridge CAMetalLayer *)front_metal_layer();
              if (!layer || !t) return 0;
              id<MTLTexture> src = tex_mtl(t);
              if (!src) return 0;
              if (!g_cls_pso || g_cls_fmt != layer.pixelFormat) {
                  NSString *msl = @"#include <metal_stdlib>\n"
                                  "using namespace metal;\n"
                                  "struct VO { float4 p [[position]]; float2 uv; };\n"
                                  "vertex VO cls_vs(uint vid [[vertex_id]], constant int &flip [[buffer(0)]]) {\n"
                                  "    float2 xy = float2((vid << 1) & 2, vid & 2);\n"
                                  "    VO o; o.p = float4(xy * 2.0 - 1.0, 0.0, 1.0);\n"
                                  "    o.uv = float2(xy.x, flip ? xy.y : 1.0 - xy.y);\n"
                                  "    return o;\n"
                                  "}\n"
                                  "fragment float4 cls_fs(VO i [[stage_in]], texture2d<float> t [[texture(0)]], sampler s [[sampler(0)]]) { return float4(t.sample(s, i.uv).rgb, 1.0); }\n";
                  NSError *e = nil;
                  id<MTLLibrary> lib = [g_dev newLibraryWithSource:msl options:nil error:&e];
                  if (!lib) { static int once; if (!once++) MLOG("[RED] classic present: shader compile failed: %s", e.localizedDescription.UTF8String); return 0; }
                  MTLRenderPipelineDescriptor *pd = [MTLRenderPipelineDescriptor new];
                  pd.vertexFunction = [lib newFunctionWithName:@"cls_vs"]; pd.fragmentFunction = [lib newFunctionWithName:@"cls_fs"];
                  pd.colorAttachments[0].pixelFormat = layer.pixelFormat;
                  g_cls_pso = [g_dev newRenderPipelineStateWithDescriptor:pd error:&e];
                  if (!g_cls_pso) { static int once; if (!once++) MLOG("[RED] classic present: pipeline failed: %s", e.localizedDescription.UTF8String); return 0; }
                  MTLSamplerDescriptor *sd = [MTLSamplerDescriptor new];
                  sd.minFilter = sd.magFilter = MTLSamplerMinMagFilterLinear; sd.sAddressMode = sd.tAddressMode = MTLSamplerAddressModeClampToEdge;
                  g_cls_smp = [g_dev newSamplerStateWithDescriptor:sd];
                  g_cls_fmt = layer.pixelFormat;
                  MLOG("classic present: no Metal 4, drawing the window image to the layer with a plain render pass (%lux%lu -> drawable %.0fx%.0f)", (unsigned long)src.width, (unsigned long)src.height, layer.drawableSize.width, layer.drawableSize.height);
              }
              id<CAMetalDrawable> dr = [layer nextDrawable];
              if (!dr) return 0;
              id<MTLCommandBuffer> cb = [g_q commandBuffer];
              if (ev_val && g_ext_ev) [cb encodeWaitForEvent:g_ext_ev value:ev_val];
              MTLRenderPassDescriptor *rp = [MTLRenderPassDescriptor renderPassDescriptor];
              rp.colorAttachments[0].texture = dr.texture; rp.colorAttachments[0].loadAction = MTLLoadActionClear;
              rp.colorAttachments[0].clearColor = MTLClearColorMake(0, 0, 0, 1); rp.colorAttachments[0].storeAction = MTLStoreActionStore;
              id<MTLRenderCommandEncoder> re = [cb renderCommandEncoderWithDescriptor:rp];
              double dw = (double)dr.texture.width, dh = (double)dr.texture.height, sc = fmin(dw / (double)src.width, dh / (double)src.height), w = (double)src.width * sc, h = (double)src.height * sc;
              [re setViewport:(MTLViewport){(dw - w) / 2, (dh - h) / 2, w, h, 0.0, 1.0}];
              [re setRenderPipelineState:g_cls_pso];
              int flip = atomic_load(&g_origin_ll) ? 1 : 0;   // GL's window image is stored bottom row first
              [re setVertexBytes:&flip length:sizeof flip atIndex:0];
              [re setFragmentTexture:src atIndex:0]; [re setFragmentSamplerState:g_cls_smp atIndex:0];
              [re drawPrimitives:MTLPrimitiveTypeTriangle vertexStart:0 vertexCount:3];
              [re endEncoding];
              pthread_mutex_lock(&g_pq_mu); uint64_t tk = ++g_pq_in; g_pq_inflight++; pthread_mutex_unlock(&g_pq_mu);
              [cb addCompletedHandler:^(id<MTLCommandBuffer> c) {
                  if (c.error) { static int once; if (!once++) MLOG("[RED] classic present: command buffer error: %s", c.error.description.UTF8String); }
                  pthread_mutex_lock(&g_pq_mu); if (tk > g_pq_done) g_pq_done = tk; g_pq_inflight--; pthread_cond_broadcast(&g_pq_cv); pthread_mutex_unlock(&g_pq_mu);
              }];
              [cb presentDrawable:dr];
              [cb commit];
              return tk;
          }
          static uint64_t present_enqueue(const tex_t *t, double period, const int crop[4], uint64_t ev_val) {
              atomic_store(&dm_present_ns, now_ns());
              if (g_classic && !atomic_load(&g_present_discard)) return present_classic(t, ev_val);
              if (g_classic || atomic_load(&g_present_discard)) return 0;'''),
          ])

          # ---- 3. nvn_mtl.m: classic-Metal stand-ins for Metal 4 so the NVN layer starts on an A13 (iPhone SE 2020 and older) ----
          SHIM = r'''static int g_shim;   // 1 once the classic-Metal stand-ins for Metal 4 are installed (mtl_init); stays 0 on a Mac or a GPU with Metal 4
          #if TARGET_OS_IOS && !TARGET_OS_SIMULATOR
          #import <objc/runtime.h>
          // ===================================================================================================================================================================
          // Classic-Metal stand-ins for the Metal 4 objects, for a GPU without Metal 4 (A13 / iPhone SE 2020 and older). The NVN layer talks to MTL4 queues, command buffers, encoders and
          // argument tables; mtl_init wraps the device in NxDevice, which hands out these classes instead. They record nothing: each call is run at once on a classic MTLCommandQueue.
          //  - argument tables hold GPU addresses and resource IDs; a draw / dispatch binds the ones that changed with setBuffer / setTexture (the address is looked up among the residency set's buffers)
          //  - the residency sets are plain sets; every encoder marks all of their resources resident (useResources), because shaders reach textures and storage buffers through IDs / addresses read from buffers
          //  - barriers are left to classic Metal's own hazard tracking (the layer creates no untracked resources, apart from the optional image heap)
          // ===================================================================================================================================================================
          static id<MTLCommandQueue> g_shim_q;
          static pthread_mutex_t g_shim_mu = PTHREAD_MUTEX_INITIALIZER;
          static uint64_t g_shim_gen;
          typedef struct { uint64_t lo, hi; __unsafe_unretained id<MTLBuffer> buf; } shim_range;
          static shim_range *g_shim_rg; static size_t g_shim_rn, g_shim_rcap;
          static NSMutableSet *g_shim_set, *g_shim_heaps;
          static NSArray *g_shim_snap; static int g_shim_dirty = 1;
          static NSMapTable *g_shim_rid;   // MTLResourceID._impl -> texture / sampler (weak)
          static const char kShimFb;

          static size_t shim_lower(uint64_t a) { size_t lo = 0, hi = g_shim_rn; while (lo < hi) { size_t m = (lo + hi) / 2; if (g_shim_rg[m].lo <= a) lo = m + 1; else hi = m; } return lo; }   // first range with lo > a
          static void shim_add(id a) {
              if (!a) return;
              pthread_mutex_lock(&g_shim_mu);
              if (!g_shim_set) { g_shim_set = [NSMutableSet set]; g_shim_heaps = [NSMutableSet set]; }
              if ([a conformsToProtocol:@protocol(MTLHeap)]) { [g_shim_heaps addObject:a]; }
              else if (![g_shim_set containsObject:a]) {
                  [g_shim_set addObject:a]; g_shim_dirty = 1;
                  if ([a conformsToProtocol:@protocol(MTLBuffer)]) {
                      id<MTLBuffer> b = a; uint64_t lo = b.gpuAddress, len = b.length;
                      if (len) {
                          if (g_shim_rn == g_shim_rcap) { g_shim_rcap = g_shim_rcap ? g_shim_rcap * 2 : 1024; g_shim_rg = realloc(g_shim_rg, g_shim_rcap * sizeof *g_shim_rg); }
                          size_t i = shim_lower(lo); memmove(&g_shim_rg[i + 1], &g_shim_rg[i], (g_shim_rn - i) * sizeof *g_shim_rg);
                          g_shim_rg[i] = (shim_range){lo, lo + len, b}; g_shim_rn++;
                      }
                  }
              }
              pthread_mutex_unlock(&g_shim_mu);
          }
          static void shim_remove(id a) {
              if (!a) return;
              pthread_mutex_lock(&g_shim_mu);
              if ([a conformsToProtocol:@protocol(MTLHeap)]) [g_shim_heaps removeObject:a];
              else if ([g_shim_set containsObject:a]) {
                  [g_shim_set removeObject:a]; g_shim_dirty = 1;
                  if ([a conformsToProtocol:@protocol(MTLBuffer)]) {
                      for (size_t i = 0; i < g_shim_rn; i++) if (g_shim_rg[i].buf == a) { memmove(&g_shim_rg[i], &g_shim_rg[i + 1], (g_shim_rn - i - 1) * sizeof *g_shim_rg); g_shim_rn--; break; }
                  }
              }
              pthread_mutex_unlock(&g_shim_mu);
          }
          static id<MTLBuffer> shim_buf(uint64_t addr, NSUInteger *off) {
              static int warned;
              pthread_mutex_lock(&g_shim_mu);
              size_t i = shim_lower(addr); id<MTLBuffer> b = nil;
              if (i && addr < g_shim_rg[i - 1].hi) { b = g_shim_rg[i - 1].buf; *off = (NSUInteger)(addr - g_shim_rg[i - 1].lo); }
              pthread_mutex_unlock(&g_shim_mu);
              if (!b && warned++ < 8) MLOG("[RED] shim: no buffer holds GPU address %#llx", (unsigned long long)addr);
              return b;
          }
          static id shim_rid_get(uint64_t rid) {
              static int warned;
              pthread_mutex_lock(&g_shim_mu); id o = [g_shim_rid objectForKey:@(rid)]; pthread_mutex_unlock(&g_shim_mu);
              if (!o && warned++ < 8) MLOG("[RED] shim: unknown resource ID %#llx", (unsigned long long)rid);
              return o;
          }
          static void shim_rid_hook(id obj) {   // the texture / sampler classes report their resource ID through gpuResourceID: remember what each ID belongs to
              static NSMutableSet *done; static dispatch_once_t once; dispatch_once(&once, ^{ done = [NSMutableSet set]; g_shim_rid = [NSMapTable strongToWeakObjectsMapTable]; });
              Class c = object_getClass(obj);
              pthread_mutex_lock(&g_shim_mu); BOOL seen = [done containsObject:c]; if (!seen) [done addObject:c]; pthread_mutex_unlock(&g_shim_mu);
              if (seen) return;
              SEL s = @selector(gpuResourceID); Method m = class_getInstanceMethod(c, s); if (!m) return;
              MTLResourceID (*orig)(id, SEL) = (MTLResourceID (*)(id, SEL))method_getImplementation(m);
              IMP n = imp_implementationWithBlock(^MTLResourceID(id me) {
                  MTLResourceID r = orig(me, s);
                  pthread_mutex_lock(&g_shim_mu); [g_shim_rid setObject:me forKey:@(r._impl)]; pthread_mutex_unlock(&g_shim_mu);
                  return r;
              });
              class_replaceMethod(c, s, n, method_getTypeEncoding(m));
              MLOG("shim: hooked gpuResourceID of %s", class_getName(c));
          }
          // Every encoder makes everything in the residency sets resident (classic Metal needs it for resources reached through addresses / IDs held in buffers)
          static void shim_use(id enc) {
              pthread_mutex_lock(&g_shim_mu);
              if (g_shim_dirty || !g_shim_snap) { g_shim_snap = [g_shim_set allObjects]; g_shim_dirty = 0; }
              NSArray *a = g_shim_snap, *h = g_shim_heaps.count ? [g_shim_heaps allObjects] : nil;
              pthread_mutex_unlock(&g_shim_mu);
              NSUInteger n = a.count;
              if (n) { id __unsafe_unretained *p = (id __unsafe_unretained *)malloc(n * sizeof *p); [a getObjects:p range:NSMakeRange(0, n)]; [enc useResources:(const id<MTLResource> __unsafe_unretained *)p count:n usage:MTLResourceUsageRead | MTLResourceUsageWrite]; free(p); }
              NSUInteger hn = h.count;
              if (hn) { id __unsafe_unretained *p = (id __unsafe_unretained *)malloc(hn * sizeof *p); [h getObjects:p range:NSMakeRange(0, hn)]; [enc useHeaps:(const id<MTLHeap> __unsafe_unretained *)p count:hn]; free(p); }
          }

          @interface NxBase : NSObject @end
          @implementation NxBase
          - (void)doesNotRecognizeSelector:(SEL)s { MLOG("[RED] shim: %s does not implement %s", class_getName(object_getClass(self)), sel_getName(s)); [super doesNotRecognizeSelector:s]; }
          @end

          @interface NxFeedback : NxBase @property NSError *error; @property CFTimeInterval GPUStartTime, GPUEndTime; @end
          @implementation NxFeedback @end

          @interface NxResidencySet : NxBase @end
          @implementation NxResidencySet
          - (void)addAllocation:(id)a { shim_add(a); }
          - (void)addAllocations:(const id __unsafe_unretained *)p count:(NSUInteger)n { for (NSUInteger i = 0; i < n; i++) shim_add(p[i]); }
          - (void)removeAllocation:(id)a { shim_remove(a); }
          - (void)removeAllocations:(const id __unsafe_unretained *)p count:(NSUInteger)n { for (NSUInteger i = 0; i < n; i++) shim_remove(p[i]); }
          - (void)removeAllAllocations {}
          - (void)commit {}
          - (void)requestResidency {}
          - (void)endResidency {}
          - (void)setLabel:(NSString *)l { (void)l; }
          @end

          @interface NxAllocator : NxBase @end
          @implementation NxAllocator
          - (void)reset {}
          - (void)setLabel:(NSString *)l { (void)l; }
          - (NSString *)label { return nil; }
          @end

          @interface NxTable : NxBase { @public uint64_t addr[32], tex[8], smp[8], ga[32], gt[8], gs[8]; } @end
          @implementation NxTable
          - (void)setAddress:(uint64_t)a atIndex:(NSUInteger)i { if (i < 32) { addr[i] = a; ga[i] = ++g_shim_gen; } }
          - (void)setAddress:(uint64_t)a attributeStride:(NSUInteger)s atIndex:(NSUInteger)i { (void)s; [self setAddress:a atIndex:i]; }
          - (void)setTexture:(MTLResourceID)r atIndex:(NSUInteger)i { if (i < 8) { tex[i] = r._impl; gt[i] = ++g_shim_gen; } }
          - (void)setSamplerState:(MTLResourceID)r atIndex:(NSUInteger)i { if (i < 8) { smp[i] = r._impl; gs[i] = ++g_shim_gen; } }
          @end

          typedef struct { uint64_t a[32], t[8], s[8]; } nx_bound;   // what an encoder has bound from one table (the table's generation per slot)
          static inline void nx_flush_table(NxTable *t, nx_bound *b, int stage, id enc) {   // stage: 0 vertex, 1 fragment, 2 compute
              if (!t) return;
              id<MTLRenderCommandEncoder> re = stage < 2 ? enc : nil;
              id<MTLComputeCommandEncoder> ce = stage == 2 ? enc : nil;
              for (int i = 0; i < 32; i++) if (t->addr[i] && t->ga[i] != b->a[i]) {
                  b->a[i] = t->ga[i]; NSUInteger off = 0; id<MTLBuffer> buf = shim_buf(t->addr[i], &off); if (!buf) continue;
                  if (stage == 0) [re setVertexBuffer:buf offset:off atIndex:i]; else if (stage == 1) [re setFragmentBuffer:buf offset:off atIndex:i]; else [ce setBuffer:buf offset:off atIndex:i];
              }
              for (int i = 0; i < 8; i++) {
                  if (t->tex[i] && t->gt[i] != b->t[i]) { b->t[i] = t->gt[i]; id<MTLTexture> o = shim_rid_get(t->tex[i]);
                      if (o) { if (stage == 0) [re setVertexTexture:o atIndex:i]; else if (stage == 1) [re setFragmentTexture:o atIndex:i]; else [ce setTexture:o atIndex:i]; } }
                  if (t->smp[i] && t->gs[i] != b->s[i]) { b->s[i] = t->gs[i]; id<MTLSamplerState> o = shim_rid_get(t->smp[i]);
                      if (o) { if (stage == 0) [re setVertexSamplerState:o atIndex:i]; else if (stage == 1) [re setFragmentSamplerState:o atIndex:i]; else [ce setSamplerState:o atIndex:i]; } }
              }
          }

          static void nx_copy_prop(id s, id d, NSString *k) { if ([s respondsToSelector:NSSelectorFromString(k)] && [d respondsToSelector:NSSelectorFromString(k)]) { @try { id v = [s valueForKey:k]; if (v) [d setValue:v forKey:k]; } @catch (id e) { (void)e; } } }
          static MTLRenderPassDescriptor *nx_rpd(MTL4RenderPassDescriptor *s) {
              MTLRenderPassDescriptor *d = [MTLRenderPassDescriptor renderPassDescriptor];
              for (int i = 0; i < 8; i++) { MTLRenderPassColorAttachmentDescriptor *a = s.colorAttachments[i]; if (a.texture) d.colorAttachments[i] = [a copy]; }
              if (s.depthAttachment.texture) d.depthAttachment = [s.depthAttachment copy];
              if (s.stencilAttachment.texture) d.stencilAttachment = [s.stencilAttachment copy];
              for (NSString *k in @[@"renderTargetArrayLength", @"defaultRasterSampleCount", @"renderTargetWidth", @"renderTargetHeight", @"visibilityResultBuffer", @"imageblockSampleLength", @"threadgroupMemoryLength", @"tileWidth", @"tileHeight"]) nx_copy_prop(s, d, k);
              return d;
          }

          @interface NxRenderEnc : NxBase { @public id<MTLRenderCommandEncoder> e; NxTable *tv, *tf; nx_bound nbv, nbf; } @end
          @implementation NxRenderEnc
          - (id)forwardingTargetForSelector:(SEL)s { return e; }
          - (BOOL)respondsToSelector:(SEL)s { return [super respondsToSelector:s] || [e respondsToSelector:s]; }
          - (void)setArgumentTable:(NxTable *)t atStages:(MTLRenderStages)s { if (s & MTLRenderStageVertex) tv = t; if (s & MTLRenderStageFragment) tf = t; }
          - (void)flush { nx_flush_table(tv, &nbv, 0, e); nx_flush_table(tf, &nbf, 1, e); }
          - (void)drawPrimitives:(MTLPrimitiveType)p vertexStart:(NSUInteger)v vertexCount:(NSUInteger)n { [self flush]; [e drawPrimitives:p vertexStart:v vertexCount:n]; }
          - (void)drawPrimitives:(MTLPrimitiveType)p vertexStart:(NSUInteger)v vertexCount:(NSUInteger)n instanceCount:(NSUInteger)i { [self flush]; [e drawPrimitives:p vertexStart:v vertexCount:n instanceCount:i]; }
          - (void)drawPrimitives:(MTLPrimitiveType)p vertexStart:(NSUInteger)v vertexCount:(NSUInteger)n instanceCount:(NSUInteger)i baseInstance:(NSUInteger)b { [self flush]; [e drawPrimitives:p vertexStart:v vertexCount:n instanceCount:i baseInstance:b]; }
          - (void)drawPrimitives:(MTLPrimitiveType)p indirectBuffer:(uint64_t)g { [self flush]; NSUInteger o = 0; id<MTLBuffer> b = shim_buf(g, &o); if (b) [e drawPrimitives:p indirectBuffer:b indirectBufferOffset:o]; }
          - (void)drawIndexedPrimitives:(MTLPrimitiveType)p indexCount:(NSUInteger)n indexType:(MTLIndexType)t indexBuffer:(uint64_t)g indexBufferLength:(NSUInteger)len { (void)len; [self flush]; NSUInteger o = 0; id<MTLBuffer> b = shim_buf(g, &o); if (b) [e drawIndexedPrimitives:p indexCount:n indexType:t indexBuffer:b indexBufferOffset:o]; }
